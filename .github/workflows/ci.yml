name: ShopRec checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test recommendation, storage and HTTP behaviour
        run: python -m unittest discover -s tests -v
      - name: Validate JavaScript syntax
        run: |
          for file in static/*.js; do node --check "$file"; done
      - name: Check frontend API and state integration
        run: node tests/test_frontend.cjs
      - name: Compile Python modules
        run: python -m compileall -q .
